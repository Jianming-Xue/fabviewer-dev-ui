# CI（2026-10-27）：push 到 main 与所有 PR 跑质量三件套。
# lint 用校验形态（不带 --fix）——仓库内 npm run lint 带 --fix 会改文件，CI 只验不改。
# CDP 验收脚本（scripts/cdp）暂不进 CI：依赖真实 Chrome + dev server，且 HEAD 有已知
# headless 环境红灯（docs/HANDOVER.md §六.11），待真实浏览器复核后再作独立作业接入。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # engines: ^22.18.0 || >=24.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint (validate only)
        run: |
          npx oxlint . --ignore-path .oxlintignore
          npx eslint .

      - name: Build
        run: npm run build-only
